<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Integration Console{% endblock %} · Falcon THF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    {% block head %}{% endblock %}
    <style>
        :root { --falcon-navy: #12233f; --falcon-blue: #2764e7; }
        body { background: #f5f7fb; color: #172033; }
        .navbar { background: var(--falcon-navy); }
        .brand-mark {
            align-items: center; background: var(--falcon-blue); border-radius: .65rem;
            display: inline-flex; font-weight: 700; height: 2.15rem;
            justify-content: center; margin-right: .7rem; width: 2.15rem;
        }
        .content-shell { max-width: 1320px; }
        .card { border: 0; box-shadow: 0 .25rem 1rem rgba(22, 38, 66, .07); }
        .btn-primary { background-color: var(--falcon-blue); border-color: var(--falcon-blue); }
    </style>
</head>
<body>
{% if current_user %}
<nav class="navbar navbar-expand navbar-dark shadow-sm">
    <div class="container-fluid content-shell">
        <a class="navbar-brand d-flex align-items-center fw-semibold" href="{{ url_for('dashboard') }}">
            <span class="brand-mark">F</span>Integration Console
        </a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span class="small opacity-75 d-none d-sm-inline">{{ current_user.username }}</span>
            <form method="post" action="{{ url_for('logout') }}" class="m-0">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-sm btn-outline-light">Sign out</button>
            </form>
        </div>
    </div>
</nav>
{% endif %}

{% block body %}{% endblock %}

<script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
</body>
</html>
